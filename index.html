<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp</title>
  <meta name="description" content="A minimalist dark mode signup page built with HTML, CSS, and JS validation.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="main-container">
    <div class="signup-card">
      <h1 class="form-title">Signup</h1>

      <form id="signupForm" class="signup-form" novalidate>

        <!-- Full Name -->
        <div class="input-field">
          <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>
          <span class="error-msg" id="fullNameError"></span>
        </div>

        <!-- Email -->
        <div class="input-field">
          <input type="email" id="email" name="email" placeholder="Email" required>
          <span class="error-msg" id="emailError"></span>
        </div>

        <!-- Password -->
        <div class="input-field">
          <input type="password" id="password" name="password" placeholder="Password" required>
          <span class="error-msg" id="passwordError"></span>
        </div>

        <!-- Confirm Password -->
        <div class="input-field">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
          <span class="error-msg" id="confirmPasswordError"></span>
        </div>

        <!-- Date of Birth -->
        <div class="input-field">
          <input type="text" id="dob" name="dob" placeholder="MM/DD/YYYY" onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'" required>
          <span class="error-msg" id="dobError"></span>
        </div>

        <!-- Radio Options -->
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="role" value="Student" required>
            <span class="radio-custom"></span>
            Student
          </label>

          <label class="radio-label">
            <input type="radio" name="role" value="Employee" required>
            <span class="radio-custom"></span>
            Employee
          </label>
        </div>
        <span class="error-msg" id="roleError"></span>

        <!-- Checkbox Option -->
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="terms" name="terms" required>
            <span class="checkbox-custom"></span>
            I agree to all the Terms and conditions
          </label>
          <span class="error-msg" id="termsError"></span>
        </div>

        <!-- Feedback Alert Banner -->
        <div id="feedbackBanner" class="feedback-banner"></div>

        <!-- Submit Button -->
        <div class="btn-container">
          <button type="submit" class="submit-btn">Signup</button>
        </div>

      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
